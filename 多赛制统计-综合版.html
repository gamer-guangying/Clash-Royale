                roundSchedule.forEach((round, roundIdx) => {
                    html += `<div class="round-group">`;
                    html += `<div class="round-header">
                            <span class="round-num">第${round.round}轮</span>
                            <span>${round.matches.length}场对决</span>
                        </div>`;

                    round.matches.forEach((m, matchIdx) => {
                        const pA = currentPlayers[m[0]];
                        const pB = currentPlayers[m[1]];
                        html += `
                        <div class="match-card match-pending" id="matchCard${globalMatchIdx}" data-match-index="${globalMatchIdx}">
                            <span class="match-player" id="matchPlayerA${globalMatchIdx}">${pA.name}</span>
                            <span class="match-result-dot" id="dotA${globalMatchIdx}"></span>
                            <div class="match-input-wrap">
                                <input type="number" class="match-input" id="inputA${globalMatchIdx}" 
                                    min="0" step="1" inputmode="numeric" pattern="[0-9]*"
                                    placeholder="0" aria-label="${pA.name} 皇冠数"
                                    data-match="${globalMatchIdx}" data-player="A">
                                <span class="match-vs">VS</span>
                                <input type="number" class="match-input" id="inputB${globalMatchIdx}" 
                                    min="0" step="1" inputmode="numeric" pattern="[0-9]*"
                                    placeholder="0" aria-label="${pB.name} 皇冠数"
                                    data-match="${globalMatchIdx}" data-player="B">
                            </div>
                            <span class="match-result-dot" id="dotB${globalMatchIdx}"></span>
                            <span class="match-player" id="matchPlayerB${globalMatchIdx}">${pB.name}</span>
                        </div>`;
                        globalMatchIdx++;
                    });
                    html += `</div>`;
                });
                matchesSection.innerHTML = html;

                document.querySelectorAll('.match-input').forEach(input => {
                    input.addEventListener('input', handleInputChange);
                    input.addEventListener('blur', handleInputBlur);
                    input.addEventListener('keydown', (e) => {
                        const key = e.key;
                        if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'Tab' ||
                            key === 'Backspace' || key === 'Delete' || key === 'Enter' ||
                            key === 'Home' || key === 'End' || key === 'ArrowLeft' || key === 'ArrowRight') {
                            return;
                        }
                        if (!/^[0-9]$/.test(key) && key !== 'Tab') {
                            e.preventDefault();
                        }
                    });
                });
            }

            function readAllScores() {
                const scores = [];
                for (let i = 0; i < allMatches.length; i++) {
                    const inputA = document.getElementById('inputA' + i);
                    const inputB = document.getElementById('inputB' + i);
                    const valA = inputA ? inputA.value.trim() : '';
                    const valB = inputB ? inputB.value.trim() : '';
                    const scoreA = valA === '' ? null : parseInt(valA, 10);
                    const scoreB = valB === '' ? null : parseInt(valB, 10);

                    const isComplete = (scoreA !== null && !isNaN(scoreA) && scoreA >= 0) &&
                        (scoreB !== null && !isNaN(scoreB) && scoreB >= 0);

                    scores.push({
                        matchIndex: i,
                        playerA: allMatches[i].playerA,
                        playerB: allMatches[i].playerB,
                        scoreA: isComplete ? scoreA : null,
                        scoreB: isComplete ? scoreB : null,
                        isComplete: isComplete,
                    });
                }
                return scores;
            }

            function calculateStats(scores) {
                const stats = currentPlayers.map(p => ({
                    id: p.id,
                    name: p.name,
                    wins: 0,
                    totalCrownsFor: 0,
                    totalCrownsAgainst: 0,
                    netCrowns: 0,
                    matchesPlayed: 0,
                    matchesCompleted: 0,
                }));

                scores.forEach(s => {
                    if (s.isComplete) {
                        const statA = stats[s.playerA];
                        const statB = stats[s.playerB];
                        statA.totalCrownsFor += s.scoreA;
                        statA.totalCrownsAgainst += s.scoreB;
                        statA.matchesCompleted++;
                        statA.matchesPlayed++;

                        statB.totalCrownsFor += s.scoreB;
                        statB.totalCrownsAgainst += s.scoreA;
                        statB.matchesCompleted++;
                        statB.matchesPlayed++;

                        if (s.scoreA > s.scoreB) {
                            statA.wins++;
                        } else if (s.scoreB > s.scoreA) {
                            statB.wins++;
                        }
                    }
                });

                stats.forEach(s => {
                    s.netCrowns = s.totalCrownsFor - s.totalCrownsAgainst;
                });

                stats.sort((a, b) => {
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    return b.netCrowns - a.netCrowns;
                });

                for (let i = 0; i < stats.length; i++) {
                    if (i === 0) {
                        stats[i].rank = 1;
                    } else {
                        if (stats[i].wins === stats[i - 1].wins && stats[i].netCrowns === stats[i - 1].netCrowns) {
                            stats[i].rank = stats[i - 1].rank;
                        } else {
                            stats[i].rank = i + 1;
                        }
                    }
                }

                return stats;
            }

            function updateRoundRobinUI() {
                const scores = readAllScores();
                const stats = calculateStats(scores);

                const completedCount = scores.filter(s => s.isComplete).length;
                const totalCrowns = scores.reduce((sum, s) => {
                    if (s.isComplete) return sum + s.scoreA + s.scoreB;
                    return sum;
                }, 0);
                statCompleted.textContent = completedCount;
                statRemaining.textContent = allMatches.length - completedCount;
                statTotalCrowns.textContent = totalCrowns;

                renderRankTable(stats);

                for (let i = 0; i < allMatches.length; i++) {
                    const card = document.getElementById('matchCard' + i);
                    const inputA = document.getElementById('inputA' + i);
                    const inputB = document.getElementById('inputB' + i);
                    const dotA = document.getElementById('dotA' + i);
                    const dotB = document.getElementById('dotB' + i);
                    const playerAEl = document.getElementById('matchPlayerA' + i);
                    const playerBEl = document.getElementById('matchPlayerB' + i);

                    if (!card || !inputA || !inputB) continue;

                    const s = scores[i];
                    if (s.isComplete) {
                        card.classList.add('match-completed');
                        card.classList.remove('match-pending');

                        if (s.scoreA > s.scoreB) {
                            inputA.classList.add('filled');
                            inputA.classList.remove('filled-loser');
                            inputB.classList.add('filled-loser');
                            inputB.classList.remove('filled');
                            if (dotA) { dotA.className = 'match-result-dot dot-win'; dotA.style.display = 'block'; }
                            if (dotB) { dotB.className = 'match-result-dot dot-lose'; dotB.style.display = 'block'; }
                            if (playerAEl) playerAEl.classList.add('winner-highlight');
                            if (playerBEl) playerBEl.classList.remove('winner-highlight');
                        } else if (s.scoreB > s.scoreA) {
                            inputB.classList.add('filled');
                            inputB.classList.remove('filled-loser');
                            inputA.classList.add('filled-loser');
                            inputA.classList.remove('filled');
                            if (dotA) { dotA.className = 'match-result-dot dot-lose'; dotA.style.display = 'block'; }
                            if (dotB) { dotB.className = 'match-result-dot dot-win'; dotB.style.display = 'block'; }
                            if (playerBEl) playerBEl.classList.add('winner-highlight');
                            if (playerAEl) playerAEl.classList.remove('winner-highlight');
                        } else {
                            inputA.classList.add('filled');
                            inputB.classList.add('filled');
                            inputA.classList.remove('filled-loser');
                            inputB.classList.remove('filled-loser');
                            if (dotA) { dotA.className = 'match-result-dot dot-draw'; dotA.style.display = 'block'; }
                            if (dotB) { dotB.className = 'match-result-dot dot-draw'; dotB.style.display = 'block'; }
                            if (playerAEl) playerAEl.classList.remove('winner-highlight');
                            if (playerBEl) playerBEl.classList.remove('winner-highlight');
                        }
                    } else {
                        card.classList.remove('match-completed');
                        card.classList.add('match-pending');
                        inputA.classList.remove('filled', 'filled-loser');
                        inputB.classList.remove('filled', 'filled-loser');
                        if (dotA) { dotA.className = 'match-result-dot'; dotA.style.display = 'none'; }
                        if (dotB) { dotB.className = 'match-result-dot'; dotB.style.display = 'none'; }
                        if (playerAEl) playerAEl.classList.remove('winner-highlight');
                        if (playerBEl) playerBEl.classList.remove('winner-highlight');
                    }
                }

                if (completedCount === allMatches.length && allMatches.length > 0) {
                    const top2 = stats.filter(s => s.rank <= 2);
                    const top2Names = top2.map(s => s.name).join(' 和 ');
                    showToast('🎉 全部比赛结束！晋级选手：' + top2Names);
                }
            }

            function renderRankTable(stats) {
                let rankHTML = '';
                stats.forEach((s, idx) => {
                    const rankClass = s.rank === 1 ? 'rank-1' : (s.rank === 2 ? 'rank-2' : '');
                    const isQualified = s.rank <= 2;
                    const netClass = s.netCrowns > 0 ? 'net-crown-positive' : (s.netCrowns < 0 ?
                        'net-crown-negative' : 'net-crown-zero');
                    const netSign = s.netCrowns > 0 ? '+' : '';
                    rankHTML += `
                        <tr class="${rankClass}">
                            <td>
                                <span class="rank-badge">${s.rank === 1 ? '👑' : (s.rank === 2 ? '🥈' : s.rank)}</span>
                            </td>
                            <td>
                                ${s.name}
                                ${isQualified ? '<span class="qualified-badge">晋级</span>' : ''}
                            </td>
                            <td><strong>${s.wins}</strong></td>
                            <td class="${netClass}">${netSign}${s.netCrowns}</td>
                            <td>${s.totalCrownsFor}</td>
                            <td>${s.totalCrownsAgainst}</td>
                        </tr>`;
                });
                rankTableBody.innerHTML = rankHTML;

            function handleInputChange(e) {

                const player = input.dataset.player;
                const otherInput = document.getElementById(
                    (player === 'A' ? 'inputB' : 'inputA') + matchIdx
                );

                let val = input.value.replace(/[^0-9]/g, '');
                if (val !== input.value) {
                    input.value = val;
                }
                if (val.length > 1 && val.startsWith('0')) {
                    val = String(parseInt(val, 10));
                    input.value = val;
                }

                updateRoundRobinUI();

                if (input.value.trim() !== '' && otherInput && otherInput.value.trim() !== '') {
                    const nextMatchIdx = matchIdx + 1;
                    if (nextMatchIdx < allMatches.length) {
                        const nextInputA = document.getElementById('inputA' + nextMatchIdx);
                        if (nextInputA && nextInputA.value.trim() === '') {
                            setTimeout(() => {
                                nextInputA.focus();
                            }, 300);
                        }
                    }
                }
            }

            function handleInputBlur(e) {
                const input = e.target;
                let val = input.value.trim();
                if (val === '') {
                } else {
                    let num = parseInt(val, 10);
                    if (isNaN(num) || num < 0) {
                        input.value = '';
                    } else {

            function renderMatchCard(match) {

                const playerAClass = isFinished && winnerIsA ? 'winner' : '';
                const playerBClass = isFinished && !winnerIsA ? 'winner' : '';
                
                const scoreDisplay = (match.scoreA || match.scoreB) ? 
                    `<div class="match-score">${match.scoreA || '-'} - ${match.scoreB || '-'}</div>` : '';

                    `<div class="player-card ${playerAClass} ${zone}">

                        <span class="player-name">${match.playerA.name}</span>
                    </div>` : 
                    `<div class="player-card empty ${zone}">待定</div>`;
                
                const playerB = match.playerB ? 
                    `<div class="player-card ${playerBClass} ${zone}">
                        <span class="player-flag">${match.playerB.flag}</span>
                        <span class="player-name">${match.playerB.name}</span>
                    </div>` : 
                    `<div class="player-card empty ${zone}">待定</div>`;
                
                let statusLabel = '';
                if (match.id === 'final_match') {
                    statusLabel = isFinished ? '<div class="status-label champion">👑 冠军选手</div>' : '<div class="status-label">总决赛</div>';
                } else if (match.zone === 'winner') {
                    statusLabel = '<div class="status-label winner">胜者组晋级</div>';
                } else if (match.zone === 'loser') {
                    statusLabel = '<div class="status-label loser">败者组晋级</div>';
                }
                
                return `
                    <div class="match-node ${zone}">
                        <div class="match-label">${match.label}</div>
                        ${playerA}
                        <div class="vs-label">VS</div>
                        ${playerB}
                        ${scoreDisplay}
                        ${statusLabel}
                    </div>
                `;
            }

            function drawBracketLines(mode) {
                const container = bracketContainer;
                const svg = bracketSvg;
                const containerRect = container.getBoundingClientRect();
                
                svg.setAttribute('width', containerRect.width);
                svg.setAttribute('height', containerRect.height);
                
                svg.innerHTML = '';
                
                const getNodeCenter = (id) => {
                    const cell = document.querySelector(`.bracket-cell[data-id="${id}"]`);
                    if (!cell) return null;
                    const rect = cell.getBoundingClientRect();
                    return {
                        x: rect.left - containerRect.left + rect.width / 2,
                        y: rect.top - containerRect.top + rect.height / 2
                    };
                };
                
                const drawLine = (fromId, toId, isCross = false) => {
                    const from = getNodeCenter(fromId);
                    const to = getNodeCenter(toId);
                    if (!from || !to) return;
                    
                    const cell = document.querySelector(`.bracket-cell[data-id="${fromId}"]`);
                    const match = cell?.querySelector('.match-node');
                    const rect = match?.getBoundingClientRect();
                    const fromX = rect ? rect.left - containerRect.left + rect.width : from.x;
                    
                    const toCell = document.querySelector(`.bracket-cell[data-id="${toId}"]`);
                    const toMatch = toCell?.querySelector('.match-node');
                    const toRect = toMatch?.getBoundingClientRect();
                    const toX = toRect ? toRect.left - containerRect.left : to.x;
                    
                    const midX = (fromX + toX) / 2;
                    
                    let path = '';
                    if (isCross) {
                        path = `M ${fromX} ${from.y} L ${midX} ${from.y} L ${midX} ${to.y} L ${toX} ${to.y}`;
                    } else {
                        path = `M ${fromX} ${from.y} L ${midX} ${from.y} L ${midX} ${to.y} L ${toX} ${to.y}`;
                    }
                    
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    line.setAttribute('d', path);
                    line.setAttribute('stroke', '#60a5fa');
                    line.setAttribute('stroke-width', '2');
                    line.setAttribute('fill', 'none');
                    line.setAttribute('stroke-linecap', 'round');
                    line.setAttribute('stroke-linejoin', 'round');
                    svg.appendChild(line);
                    
                    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    const arrowSize = 6;
                    const angle = Math.atan2(to.y - midX, toX - midX);
                    const arrowPoints = `${toX},${to.y} ${toX - arrowSize * Math.cos(angle - Math.PI / 6)},${to.y - arrowSize * Math.sin(angle - Math.PI / 6)} ${toX - arrowSize * Math.cos(angle + Math.PI / 6)},${to.y - arrowSize * Math.sin(angle + Math.PI / 6)}`;
                    arrow.setAttribute('points', arrowPoints);
                    arrow.setAttribute('fill', '#60a5fa');
                    svg.appendChild(arrow);
                };
                
                if (mode === 'double8') {
                    drawLine('match_1', 'w_match_1');
                    drawLine('match_2', 'w_match_1');
                    drawLine('match_3', 'w_match_2');
                    drawLine('match_4', 'w_match_2');
                    drawLine('match_1', 'l_match_1');
                    drawLine('match_2', 'l_match_1');
                    drawLine('match_3', 'l_match_2');
                    drawLine('match_4', 'l_match_2');
                    drawLine('w_match_1', 'w_match_3');
                    drawLine('w_match_2', 'w_match_3');
                    drawLine('l_match_1', 'l_match_3');
                    drawLine('w_match_2', 'l_match_3', true);
                    drawLine('l_match_2', 'l_match_4');
                    drawLine('w_match_1', 'l_match_4', true);
                    drawLine('l_match_3', 'l_match_5');
                    drawLine('l_match_4', 'l_match_5');
                    drawLine('w_match_3', 'final_match');
                    drawLine('l_match_5', 'final_match');
                } else {
                    drawLine('match_1', 'w_match_1');
                    drawLine('match_2', 'w_match_1');
                    drawLine('match_1', 'l_match_1');
                    drawLine('match_2', 'l_match_1');
                    drawLine('w_match_1', 'final_match');
                    drawLine('l_match_1', 'l_match_2');
                    drawLine('l_match_2', 'final_match');
                }
            }

            function calculateDoubleElimStats() {
                const stats = currentPlayers.map(p => ({
                    id: p.id,
                    name: p.name,
                    wins: 0,
                    losses: 0,
                    totalCrownsFor: 0,
                    totalCrownsAgainst: 0,
                    netCrowns: 0,
                    rank: null
                }));

                const maxMatch = currentMode === 'double4' ? 7 : 15;
                const finalMatchId = currentMode === 'double4' ? 6 : 14;
                const rematchId = currentMode === 'double4' ? 7 : 15;

                for (let i = 1; i <= maxMatch; i++) {
                    const match = doubleElimMatches[i];
                    if (match.status === 'finished') {
                        const winnerIdx = stats.findIndex(s => s.name === match.winner);
                        const loserIdx = stats.findIndex(s => s.name === match.loser);
                        if (winnerIdx >= 0) stats[winnerIdx].wins++;
                        if (loserIdx >= 0) stats[loserIdx].losses++;
                    }
                }

                const rankings = {};
                const rematch = doubleElimMatches[rematchId];
                const finalMatch = doubleElimMatches[finalMatchId];
                
                if (rematch.status === 'finished') {
                    rankings[rematch.winner] = 1;
                    rankings[rematch.loser] = 2;
                } else if (finalMatch.status === 'finished') {
                    rankings[finalMatch.winner] = 1;
                    rankings[finalMatch.loser] = 2;
                }

                const thirdMatch = doubleElimMatches[finalMatchId - 1];
                if (thirdMatch.status === 'finished') {
                    rankings[thirdMatch.loser] = 3;
                }

                const fourthMatch = doubleElimMatches[finalMatchId - 2];
                if (fourthMatch && fourthMatch.status === 'finished') {
                    rankings[fourthMatch.loser] = 4;
                }

                stats.forEach(s => {
                    s.rank = rankings[s.name] || stats.length;
                });

                stats.sort((a, b) => {
                    if (a.rank && b.rank) return a.rank - b.rank;
                    if (a.rank) return -1;
                    if (b.rank) return 1;
                    return b.wins - a.wins;
                });

                renderRankTable(stats);
            }

            function getGroupStandings(players, matches) {
                const standings = players.map(p => ({
                    id: p.id,
                    name: p.name,
                    wins: 0,
                    draws: 0,
                    losses: 0,
                    crownsFor: 0,
                    crownsAgainst: 0,
                    netCrowns: 0,
                }));
                
                matches.forEach(match => {
                    if (match.scoreA !== null && match.scoreB !== null) {
                        const pA = standings[match.playerA];
                        const pB = standings[match.playerB];
                        
                        pA.crownsFor += match.scoreA;
                        pA.crownsAgainst += match.scoreB;
                        pB.crownsFor += match.scoreB;
                        pB.crownsAgainst += match.scoreA;
                        
                        if (match.scoreA > match.scoreB) {
                            pA.wins++;
                            pB.losses++;
                        } else if (match.scoreB > match.scoreA) {
                            pB.wins++;
                            pA.losses++;
                        } else {
                            pA.draws++;
                            pB.draws++;
                        }
                    }
                });
                
                standings.forEach(s => {
                    s.netCrowns = s.crownsFor - s.crownsAgainst;
                });
                
                standings.sort((a, b) => {
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    return b.netCrowns - a.netCrowns;
                });
                
                return standings;
            }

                const finalMatch = knockoutMatches[6];
                
                let html = '<div class="knockout-round"><div class="knockout-round-title">四分之一决赛</div><div class="knockout-matches">';
                round1Matches.forEach((match, idx) => {
                    const pA = players[match.playerA];
                    const pB = players[match.playerB];
                    html += `
                        <div class="knockout-match">
                            <span class="knockout-player ${pA.group === 'A' ? 'from-a' : 'from-b'}" id="ko-pA-${match.id}">${pA.name}</span>
                            <div class="knockout-score">
                                <input type="text" id="ko-scoreA-${match.id}" data-match="${match.id}" data-side="A" oninput="updateKnockoutScore(this)" />
                            </div>
                            <span class="dash">-</span>
                            <div class="knockout-score">
                                <input type="text" id="ko-scoreB-${match.id}" data-match="${match.id}" data-side="B" oninput="updateKnockoutScore(this)" />
                            </div>
                            <span class="knockout-player ${pB.group === 'A' ? 'from-a' : 'from-b'}" id="ko-pB-${match.id}">${pB.name}</span>
                        </div>
                    `;
                });
                html += '</div></div>';
                
                html += '<div class="knockout-round"><div class="knockout-round-title">半决赛</div><div class="knockout-matches">';
                round2Matches.forEach((match, idx) => {
                    html += `
                        <div class="knockout-match">
                            <span class="knockout-player" id="ko-pA-${match.id}">待定</span>
                            <div class="knockout-score">
                                <input type="text" id="ko-scoreA-${match.id}" data-match="${match.id}" data-side="A" oninput="updateKnockoutScore(this)" />
                            </div>
                            <span class="dash">-</span>
                            <div class="knockout-score">
                                <input type="text" id="ko-scoreB-${match.id}" data-match="${match.id}" data-side="B" oninput="updateKnockoutScore(this)" />
                            </div>
                            <span class="knockout-player" id="ko-pB-${match.id}">待定</span>
                        </div>
                    `;
                });
                html += '</div></div>';
                
                html += '<div class="knockout-round"><div class="knockout-round-title">决赛</div><div class="knockout-matches">';
                html += `
                    <div class="knockout-match">
                        <span class="knockout-player" id="ko-pA-${finalMatch.id}">待定</span>
                        <div class="knockout-score">
                            <input type="text" id="ko-scoreA-${finalMatch.id}" data-match="${finalMatch.id}" data-side="A" oninput="updateKnockoutScore(this)" />
                        </div>
                        <span class="dash">-</span>
                        <div class="knockout-score">
                            <input type="text" id="ko-scoreB-${finalMatch.id}" data-match="${finalMatch.id}" data-side="B" oninput="updateKnockoutScore(this)" />
                        </div>
                        <span class="knockout-player" id="ko-pB-${finalMatch.id}">待定</span>
                    </div>
                `;
                html += '</div></div>';
                
                knockoutBracket.innerHTML = html;
            }

            function updateKnockoutScore(input) {
                const matchId = parseInt(input.dataset.match);
                const side = input.dataset.side;
                
                let val = input.value.replace(/[^0-9]/g, '');
                if (val !== input.value) {
                    input.value = val;
                }
                if (val.length > 1 && val.startsWith('0')) {
                    val = String(parseInt(val, 10));
                    input.value = val;
                }
                
                const score = val === '' ? null : parseInt(val, 10);
                const match = knockoutMatches.find(m => m.id === matchId);
                if (!match) return;
                
                if (side === 'A') match.scoreA = score;
                else match.scoreB = score;
                
                if (match.scoreA !== null && match.scoreB !== null) {
                    match.winner = match.scoreA > match.scoreB ? match.playerA : match.playerB;
                    updateKnockoutAdvancement();
                }
                
                updateKnockoutWinners();
            }

            function updateKnockoutAdvancement() {
                const allAMatches = groupARounds.flatMap(r => r.matches);
                const allBMatches = groupBRounds.flatMap(r => r.matches);
                const standingsA = getGroupStandings(groupAPlayers, allAMatches);
                const standingsB = getGroupStandings(groupBPlayers, allBMatches);
                
                const knockoutPlayers = [
                    { ...standingsA[0], group: 'A', rank: 1 },
                    { ...standingsB[3], group: 'B', rank: 4 },
                    { ...standingsA[1], group: 'A', rank: 2 },
                    { ...standingsB[2], group: 'B', rank: 3 },
                    { ...standingsA[2], group: 'A', rank: 3 },
                    { ...standingsB[1], group: 'B', rank: 2 },
                    { ...standingsA[3], group: 'A', rank: 4 },
                    { ...standingsB[0], group: 'B', rank: 1 },
                ];
                
                const match1Winner = knockoutMatches[0].winner;
                const match2Winner = knockoutMatches[1].winner;
                const match3Winner = knockoutMatches[2].winner;
                const match4Winner = knockoutMatches[3].winner;
                
                if (match1Winner !== null && match2Winner !== null) {
                    knockoutMatches[4].playerA = match1Winner;
                    knockoutMatches[4].playerB = match2Winner;
                    const pA = knockoutPlayers[match1Winner];
                    const pB = knockoutPlayers[match2Winner];
                    document.getElementById('ko-pA-5').textContent = pA.name;
                    document.getElementById('ko-pA-5').className = `knockout-player ${pA.group === 'A' ? 'from-a' : 'from-b'}`;
                    document.getElementById('ko-pB-5').textContent = pB.name;
                    document.getElementById('ko-pB-5').className = `knockout-player ${pB.group === 'A' ? 'from-a' : 'from-b'}`;
                }
                
                if (match3Winner !== null && match4Winner !== null) {
                    knockoutMatches[5].playerA = match3Winner;
                    knockoutMatches[5].playerB = match4Winner;
                    const pA = knockoutPlayers[match3Winner];
                    const pB = knockoutPlayers[match4Winner];
                    document.getElementById('ko-pA-6').textContent = pA.name;
                    document.getElementById('ko-pA-6').className = `knockout-player ${pA.group === 'A' ? 'from-a' : 'from-b'}`;
                    document.getElementById('ko-pB-6').textContent = pB.name;
                    document.getElementById('ko-pB-6').className = `knockout-player ${pB.group === 'A' ? 'from-a' : 'from-b'}`;
                }
                
                const match5Winner = knockoutMatches[4].winner;
                const match6Winner = knockoutMatches[5].winner;
                
                if (match5Winner !== null && match6Winner !== null) {
                    knockoutMatches[6].playerA = match5Winner;
                    knockoutMatches[6].playerB = match6Winner;
                    const pA = knockoutPlayers[match5Winner];
                    const pB = knockoutPlayers[match6Winner];
                    document.getElementById('ko-pA-7').textContent = pA.name;
                    document.getElementById('ko-pA-7').className = `knockout-player ${pA.group === 'A' ? 'from-a' : 'from-b'}`;
                    document.getElementById('ko-pB-7').textContent = pB.name;
                    document.getElementById('ko-pB-7').className = `knockout-player ${pB.group === 'A' ? 'from-a' : 'from-b'}`;
                }
            }

            function updateKnockoutWinners() {
                knockoutMatches.forEach(match => {
                    if (match.winner !== null) {
                        const pAEl = document.getElementById(`ko-pA-${match.id}`);
                        const pBEl = document.getElementById(`ko-pB-${match.id}`);
                        if (pAEl && pBEl) {
                            if (match.winner === match.playerA) {
                                pAEl.classList.add('winner');
                                pBEl.classList.remove('winner');
                            } else {
                                pBEl.classList.add('winner');
                                pAEl.classList.remove('winner');
                            }
                        }
                    }
                });
            }

            function fillDemoData() {
                if (currentMode === 'roundrobin') {
                    const scores = readAllScores();
                    const hasData = scores.some(s => s.isComplete);
                    if (hasData && !confirm('当前已有比分数据，填入演示数据将覆盖它们。确定继续吗？')) return;

                    for (let i = 0; i < allMatches.length; i++) {
                        const inputA = document.getElementById('inputA' + i);
                        const inputB = document.getElementById('inputB' + i);
                        if (inputA && inputB) {
                            inputA.value = Math.floor(Math.random() * 3) + 1;
                            inputB.value = Math.floor(Math.random() * 3) + 1;
                        }
                    }
                    updateRoundRobinUI();
                } else if (currentMode === 'group12') {
                    const allAMatches = groupARounds.flatMap(r => r.matches);
                    const allBMatches = groupBRounds.flatMap(r => r.matches);
                    const hasData = allAMatches.some(m => m.scoreA !== null) || allBMatches.some(m => m.scoreA !== null);
                    if (hasData && !confirm('当前已有比分数据，填入演示数据将覆盖它们。确定继续吗？')) return;

                    groupARounds.forEach(round => {
                        round.matches.forEach(match => {
                            const inputA = document.getElementById('gA-scoreA-' + match.globalIdx);
                            const inputB = document.getElementById('gA-scoreB-' + match.globalIdx);
                            if (inputA && inputB) {
                                inputA.value = Math.floor(Math.random() * 3) + 1;
                                inputB.value = Math.floor(Math.random() * 3) + 1;
                            }
                        });
                    });
                    groupBRounds.forEach(round => {
                        round.matches.forEach(match => {
                            const inputA = document.getElementById('gB-scoreA-' + match.globalIdx);
                            const inputB = document.getElementById('gB-scoreB-' + match.globalIdx);
                            if (inputA && inputB) {
                                inputA.value = Math.floor(Math.random() * 3) + 1;
                                inputB.value = Math.floor(Math.random() * 3) + 1;
                            }
                        });
                    });
                    updateGroupUI();
                    setTimeout(() => {
                        enterKnockout();
                    }, 500);
                } else {
                    const hasData = Object.values(doubleElimMatches).some(m => m.status === 'finished');
                    if (hasData && !confirm('当前已有比分数据，填入演示数据将覆盖它们。确定继续吗？')) return;

                    const maxMatch = currentMode === 'double4' ? 6 : 14;
                    for (let i = 1; i <= maxMatch; i++) {
                        const match = doubleElimMatches[i];
                        if (match.player1 && match.player2) {
                            match.winner = Math.random() > 0.5 ? match.player1 : match.player2;
                            match.loser = match.winner === match.player1 ? match.player2 : match.player1;
                            match.status = 'finished';
                        }
                    }
                    updateDoubleElimMatchPlayers();
                    updateDoubleElimUI();
                }
                showToast('📊 演示数据已填入！');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            window.selectMode = selectMode;
            window.startTournament = startTournament;
            window.backToSelection = backToSelection;
            window.resetAllScores = resetAllScores;
            window.fillDemoData = fillDemoData;
            window.handleGroupInputChange = handleGroupInputChange;
            window.updateKnockoutScore = updateKnockoutScore;
            window.enterKnockout = enterKnockout;
            window.refreshKnockout = refreshKnockout;

            initSelection();
        })();
    </script>
</body>
</html>
